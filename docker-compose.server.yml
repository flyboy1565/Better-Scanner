services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: better-scanner-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DEBUG=False
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - TARGET_DIR=/app/scans
    volumes:
      - ./scans:/app/scans
    networks:
      - webproxy
      - default

  nginx:
    image: nginx:alpine
    container_name: better-scanner-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - webproxy
      - default

networks:
  webproxy:
    external: true
